<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turnen">
<title>Turnen Anwesenheit</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--card:#f1f2f5;--ok:#15803d;--no:#dc2626;--late:#b45309;--acc:#7c3aed}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f3f3f3;--mut:#9ca3af;--card:#201f24;--ok:#16a34a;--no:#ef4444;--late:#d97706;--acc:#8b5cf6;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-weight:600}
.tabs button.on{background:var(--acc);color:#fff}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);max-width:100%}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin:6px 0;justify-content:space-between}
.st{border:0;border-radius:10px;padding:10px 12px;min-width:112px;font:inherit;font-weight:700;color:#fff}
.st.P{background:var(--ok)}.st.A{background:var(--no)}.st.L{background:var(--late)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;font:inherit;font-weight:600}
.btn.g{background:var(--card);color:var(--fg)}
.mut{color:var(--mut);font-size:14px}
.held{display:flex;gap:10px;align-items:center;margin:10px 0}
.pct{font-weight:700;font-size:18px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.err{color:var(--no)}
</style></head><body>
<h1>🤸 Turnen Anwesenheit</h1>
<div class="tabs" id="tabs"><button id="t-day" class="on">Training</button><button id="t-stats">Statistik</button><button id="t-kids">Kinder</button></div>
<div id="app"><p class="mut">Lädt…</p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, collection, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCKoLyBMhSqgbCMia7NRaprJ3SbaRQsbo0",
  authDomain: "training-donnerstag-97c49.firebaseapp.com",
  projectId: "training-donnerstag-97c49",
  storageBucket: "training-donnerstag-97c49.firebasestorage.app",
  messagingSenderId: "916638947975",
  appId: "1:916638947975:web:0a6feb62dff422d10ef622"
};
const TEAM_EMAIL = "team@turnen.app";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let user=null,authKnown=false,kids=[],days={},date=today(),tab='day',yr='all',pendingDel=null,loginErr='',unsubs=[],loaded={r:false,d:false};
const NAMES={P:'Kommt',A:'Fehlt',L:'Zu spät'};

function setTab(t){tab=t;pendingDel=null;['day','stats','kids'].forEach(x=>$('#t-'+x).classList.toggle('on',x===t));render()}
['day','stats','kids'].forEach(x=>$('#t-'+x).onclick=()=>setTab(x));

const fail=()=>alert('Speichern hat nicht geklappt. Prüfe die Internetverbindung.');
const saveDay=(d,obj)=>setDoc(doc(db,'days',d),obj).catch(fail);
const saveKids=()=>setDoc(doc(db,'app','roster'),{kids}).catch(fail);

function startListening(){
  loaded={r:false,d:false};
  unsubs.push(onSnapshot(doc(db,'app','roster'),s=>{kids=(s.exists()&&s.data().kids)||[];loaded.r=true;render()},e=>{loginErr='Kein Zugriff: '+e.code;render()}));
  unsubs.push(onSnapshot(collection(db,'days'),q=>{const m={};q.forEach(x=>{m[x.id]=x.data()});days=m;loaded.d=true;render()},e=>{loginErr='Kein Zugriff: '+e.code;render()}));
}
function stopListening(){unsubs.forEach(u=>u());unsubs=[]}
onAuthStateChanged(auth,u=>{user=u;authKnown=true;stopListening();if(u)startListening();render()});

function render(){
  const a=$('#app');
  $('#tabs').style.display=user?'flex':'none';
  if(!authKnown){a.innerHTML='<p class="mut">Lädt…</p>';return}
  if(!user){renderLogin(a);return}
  if(loginErr){a.innerHTML='<p class="err">'+esc(loginErr)+'</p>';return}
  if(!loaded.r||!loaded.d){a.innerHTML='<p class="mut">Lädt…</p>';return}
  if(tab==='day')renderDay(a);else if(tab==='stats')renderStats(a);else renderKids(a);
}
function renderLogin(a){
  a.innerHTML='<p>Bitte gib das Team-Passwort ein.</p><div style="display:flex;gap:8px"><input id="pw" type="password" placeholder="Passwort" style="flex:1"><button class="btn" id="go">Los</button></div><p class="err" id="le">'+esc(loginErr)+'</p>';
  const go=async()=>{const p=$('#pw').value;if(!p)return;
    try{await signInWithEmailAndPassword(auth,TEAM_EMAIL,p);loginErr=''}
    catch(e){loginErr='Falsches Passwort.';$('#le').textContent=loginErr}};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
function renderDay(a){
  if(!kids.length){a.innerHTML='<p>Füge zuerst die Kinder hinzu: Tippe oben auf <b>Kinder</b>.</p>';return}
  const d=days[date]||{held:false,s:{}};
  let h='<div class="held"><input type="date" id="dt" value="'+esc(date)+'"></div>';
  h+='<p class="mut">Tippe auf einen Namen: Kommt → Fehlt → Zu spät.</p>';
  kids.forEach(k=>{const s=(d.s||{})[k.id]||'P';h+='<div class="row"><span>'+esc(k.name)+'</span><button class="st '+s+'" data-k="'+esc(k.id)+'">'+NAMES[s]+'</button></div>'});
  const S=d.s||{};const na=kids.filter(k=>S[k.id]==='A').length,nl=kids.filter(k=>S[k.id]==='L').length;
  h+='<div class="sum mut">'+(kids.length-na)+' kommen · '+na+' fehlen · '+nl+' zu spät</div>';
  h+='<div class="held"><button class="btn '+(d.held?'':'g')+'" id="held">'+(d.held?'✓ Zählt in der Statistik':'Dieses Training in der Statistik zählen')+'</button></div>';
  h+='<p class="mut">Tipp: Tippe auf „zählen“, wenn das Training stattgefunden hat. So zählen Fehlzeiten nur für Trainings, die wirklich waren.</p>';
  a.innerHTML=h;
  $('#dt').onchange=e=>{if(e.target.value){date=e.target.value;render()}};
  a.querySelectorAll('.st').forEach(b=>b.onclick=()=>{
    const cur=JSON.parse(JSON.stringify(days[date]||{held:false,s:{}}));cur.s=cur.s||{};
    const s=cur.s[b.dataset.k]||'P';const nx=s==='P'?'A':s==='A'?'L':'P';
    if(nx==='P')delete cur.s[b.dataset.k];else cur.s[b.dataset.k]=nx;
    days[date]=cur;render();saveDay(date,cur)});
  $('#held').onclick=()=>{const cur=JSON.parse(JSON.stringify(days[date]||{held:false,s:{}}));cur.s=cur.s||{};cur.held=!cur.held;days[date]=cur;render();saveDay(date,cur)};
}
function renderStats(a){
  const all=Object.keys(days).filter(d=>days[d].held).sort();
  const years=[...new Set(all.map(d=>d.slice(0,4)))];
  const use=all.filter(d=>yr==='all'||d.startsWith(yr));
  let h='<select id="yr"><option value="all">Alle Zeiten</option>'+years.map(y=>'<option value="'+y+'"'+(y===yr?' selected':'')+'>'+y+'</option>').join('')+'</select>';
  h+='<p class="mut">'+use.length+' Training'+(use.length===1?'':'s')+' gezählt. „Zu spät“ zählt als anwesend.</p>';
  if(!kids.length)h+='<p>Noch keine Kinder.</p>';
  kids.map(k=>{let ab=0,la=0;use.forEach(d=>{const s=(days[d].s||{})[k.id];if(s==='A')ab++;if(s==='L')la++});
    return{k,ab,la,pct:use.length?Math.round((use.length-ab)/use.length*100):null}})
  .sort((x,y)=>(x.pct===null?101:x.pct)-(y.pct===null?101:y.pct)).forEach(r=>{
    h+='<div class="row"><div><div>'+esc(r.k.name)+'</div><div class="mut">Gefehlt '+r.ab+' · Zu spät '+r.la+'</div></div><div class="pct">'+(r.pct===null?'—':r.pct+'%')+'</div></div>'});
  a.innerHTML=h;
  $('#yr').onchange=e=>{yr=e.target.value;render()};
}
function renderKids(a){
  let h='<div style="display:flex;gap:8px"><input id="nm" placeholder="Name des Kindes" style="flex:1"><button class="btn" id="add">Hinzufügen</button></div>';
  h+='<p class="mut">Name eingeben, auf Hinzufügen tippen, dann das nächste Kind.</p>';
  kids.forEach(k=>{h+='<div class="row"><span>'+esc(k.name)+'</span><button class="btn g" data-d="'+esc(k.id)+'">'+(pendingDel===k.id?'Nochmal tippen':'Entfernen')+'</button></div>'});
  a.innerHTML=h;
  const add=()=>{const v=$('#nm').value.trim();if(!v)return;kids=kids.concat([{id:'k'+Date.now().toString(36)+Math.floor(Math.random()*99),name:v}]);render();saveKids()};
  $('#add').onclick=add;$('#nm').onkeydown=e=>{if(e.key==='Enter')add()};
  a.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    if(pendingDel===b.dataset.d){kids=kids.filter(k=>k.id!==b.dataset.d);pendingDel=null;render();saveKids()}
    else{pendingDel=b.dataset.d;render()}});
}
render();
</script></body></html>
